spring.application.name=hdw
spring.datasource.url=${DB_URL:jdbc:h2:mem:hdw;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.port=${SERVER_PORT:8080}
# --- MFA (Microsoft Authenticator / TOTP) ---
app.mfa.issuer=Historias Clinicas HDW
# Cifran el secreto TOTP en la BD. CAMBIA estos valores por variables de entorno reales (si los cambias despues, los secretos ya guardados quedan ilegibles).
# El salt debe ser hexadecimal (p. ej. 16 caracteres).
app.mfa.encryption-password=${MFA_ENCRYPTION_PASSWORD:solo-para-desarrollo-cambiar}
app.mfa.encryption-salt=${MFA_ENCRYPTION_SALT:5c0744940b5c369b}
# --- Admin inicial opcional (solo se crea si ambos estan definidos) ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
