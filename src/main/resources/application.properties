spring.config.import=optional:file:.env[.properties]
spring.application.name=hdw
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hwd}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.port=${PORT:${SERVER_PORT:8080}}
# --- MFA (Microsoft Authenticator / TOTP) ---
app.mfa.issuer=Historias Clinicas HDW
# Cifran el secreto TOTP en la BD. CAMBIA estos valores por variables de entorno reales (si los cambias despues, los secretos ya guardados quedan ilegibles).
# El salt debe ser hexadecimal (p. ej. 16 caracteres).
app.mfa.encryption-password=${MFA_ENCRYPTION_PASSWORD:solo-para-desarrollo-cambiar}
app.mfa.encryption-salt=${MFA_ENCRYPTION_SALT:5c0744940b5c369b}
# --- Admin inicial opcional (solo se crea si ambos estan definidos) ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# Verificacion de correo para nuevos registros
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@localhost}
app.registration.max-resends-per-hour=${MAIL_MAX_RESENDS_PER_HOUR:5}
