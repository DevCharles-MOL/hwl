<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Historias Clínicas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="form-page">
<header class="topbar">
    <a class="brand" th:href="@{/}"><span class="brand-mark">HC</span> Historias Clínicas</a>
    <a class="nav-link" th:href="@{/}">Volver al inicio</a>
</header>
<main class="form-shell">
    <section class="form-intro">
        <p class="eyebrow">Bienvenido de nuevo</p>
        <h1>Inicia sesión</h1>
        <p>Usa el correo asociado a tu cuenta.</p>
    </section>
    <form class="form-panel">
        <p class="notice notice-success" th:if="${mensaje}" th:text="${mensaje}"></p>
        <p class="notice notice-error" th:if="${param.error}">Correo o contraseña incorrectos.</p>
        <label for="username">Correo electrónico</label>
        <input id="username" name="username" type="email" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button button-full" type="button" disabled>Acceso pendiente</button>
        <p class="form-note">El inicio de sesión se habilitará cuando configuremos la seguridad.</p>
        <p class="form-note">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
    </form>
</main>
</body>
</html>
