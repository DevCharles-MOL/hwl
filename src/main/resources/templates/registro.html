<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta | Historias Clínicas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="form-page">
<header class="topbar">
    <a class="brand" th:href="@{/}"><span class="brand-mark">HC</span> Historias Clínicas</a>
    <a class="nav-link" th:href="@{/}">Volver al inicio</a>
</header>
<main class="form-shell">
    <section class="form-intro">
        <p class="eyebrow">Nuevo usuario</p>
        <h1>Crea tu cuenta</h1>
        <p>Regístrate y verifica tu correo para activar la cuenta.</p>
    </section>
    <form class="form-panel" th:action="@{/registro}" method="post">
        <p class="notice notice-error" th:if="${error}" th:text="${error}"></p>
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text" autocomplete="name" maxlength="120" required>
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="180" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <button class="button button-full" type="submit">Crear cuenta</button>
        <p class="form-note">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
    </form>
</main>
</body>
</html>
